<div class="topnav">
  <nav aria-label="Main">
    <div class="topnav-container">
      <div class="topnav-icon">
        <a href="{{ '/' | absolute_url }}" ><img src=" {{ '/assets/img/logo_small.svg' | relative_url }}" alt="{{ site.title }} home" /></a>
      </div>
      <div class="topnav-content">
        <ul class="topnav-content-ul">
          {% for item in site.data.navigation %}
          <li class="topnav-content-li">
            <a href="{{ item.link | relative_url }}" {% if page.url contains item.identifier %} class="focus" aria-current="page" {% endif %} >
              {{ item.name }}
            </a>
          </li>
          {% endfor %}
          <!--p id="topnav-hor"></p>
          <input type="text" placeholder="Search..."-->
        </ul>
      </div>
      <button type="button" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="theme-icon-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="theme-icon-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg>
      </button>
    </div>
  </nav>
</div>
