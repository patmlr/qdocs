[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qdocs"
version = "0.1.0"
description = "The website theme and generator of qspec and qunits."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "Patrick Müller"},
]
dependencies = [
    "jinja2",
    "pygments>=2.17",  # The catppuccin styles.
]

[tool.setuptools]
packages = ["qdocs"]

[tool.setuptools.package-data]
qdocs = ["templates/*.html"]
