<!DOCTYPE html>
<html class="html-responsive" lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      // Apply a stored color theme before the first paint. Without one, the system preference is used.
      try {
        const theme = localStorage.getItem("theme");
        if (theme) document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>

{% seo %}
    <link rel="icon" href="{{ '/assets/img/logo_small.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <script src="{{ '/assets/js/script.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/mathjax-config.js' | relative_url }}" defer></script>
    <script id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js" defer></script>
    {% include head-custom.html %}
  </head>
  <body>
    {% include navigation.html %}
    <div class="bd-container">
      <div class="bd-container-left">
        <div class="bd-container-header">
          {% include header.html %}
        </div>
      </div>
      <main class="bd-container-right">
        <div class="bd-container-content">
          {{ content }}
        </div>
      </main>
    </div>
  </body>
</html>
